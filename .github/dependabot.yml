# Mantém as dependências (e patches de segurança) em dia com PRs semanais.
# Minor + patch chegam agrupados num PR só, pra não virar spam.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
